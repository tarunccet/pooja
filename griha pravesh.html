<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Griha Pravesam Interactive Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Tiro+Devanagari+Sanskrit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
        }
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: contain;
            font-size: clamp(18px, 1.6vw, 22px);
            line-height: 1.75;
            letter-spacing: 0.01em;
        }
        .mantra {
            font-family: 'Tiro Devanagari Sanskrit', serif;
            font-size: clamp(28px, 4vw, 64px);
            line-height: 1.5;
        }
        .step-container {
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .step {
            min-width: 100%;
            flex-shrink: 0;
        }
        .step-content {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            box-shadow: 0 24px 60px -18px rgba(120, 53, 15, 0.25);
            border: 1px solid rgba(120, 53, 15, 0.12);
            margin-bottom: 6rem;
        }
        @media (min-width: 768px) {
            .step-content {
                margin-bottom: 0;
            }
        }
        .step-title {
            font-size: clamp(2.3rem, 3vw, 3.2rem);
        }
        .step-text {
            font-size: clamp(1.1rem, 1.5vw, 1.35rem);
        }
        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .progress-item[aria-current="true"] {
            box-shadow: inset 0 0 0 2px rgba(120, 53, 15, 0.85);
        }
        .progress-item:focus-visible {
            outline: 3px solid rgba(234, 179, 8, 0.8);
            outline-offset: 3px;
        }
        .nav-button {
            transition: background-color 0.2s, transform 0.2s;
        }
        .nav-button:active {
            transform: scale(0.95);
            background-color: rgba(255, 255, 255, 0.2);
        }
        @media (prefers-reduced-motion: reduce) {
            .step-container {
                transition: none;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-amber-100 to-amber-200 text-amber-900 h-screen w-screen overflow-hidden flex flex-col antialiased">

    <!-- Main Container -->
    <main id="main-container" class="flex-grow flex flex-col h-full overflow-hidden relative">

        <!-- Progress Bar -->
        <div class="w-full px-4 pt-6 md:px-10 z-10">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                <div>
                    <h1 class="text-base md:text-lg font-semibold tracking-wide uppercase text-amber-700">Griha Pravesam Interactive Guide</h1>
                    <p class="text-sm md:text-base text-amber-700/90">Follow each step calmly. Swipe, use arrow keys, or tap the buttons to navigate.</p>
                </div>
                <div id="step-counter" class="rounded-full bg-amber-900/10 px-4 py-2 text-sm md:text-base font-semibold text-amber-900 tracking-wide text-center" role="status" aria-live="polite"></div>
            </div>
            <div id="progress-container" class="mt-4 flex overflow-x-auto gap-2 pb-2 no-scrollbar" aria-label="Step navigator">
                <!-- Progress buttons inserted here by JS -->
            </div>
        </div>

        <!-- Steps Carousel -->
        <div id="steps-carousel" class="flex-grow flex items-center justify-center overflow-hidden w-full px-3 pb-6 md:pb-20 md:px-12">
            <div id="step-container" class="flex h-full w-full">
                <!-- Steps will be inserted here by JS -->
            </div>
        </div>

    </main>

            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        </button>
        <button id="next-btn" class="nav-button bg-amber-900 hover:bg-amber-800 text-amber-50 rounded-full w-16 h-16 md:w-20 md:h-20 flex items-center justify-center pointer-events-auto shadow-xl focus-visible:outline focus-visible:outline-amber-500 focus-visible:outline-offset-4" aria-label="Next step">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>

    </div>

    { part: "Part 5: Concluding", title: "Final Steps", instruction: "Sprinkle holy water from the Kalasam in all rooms using a mango leaf. Conclude with a final Aarathi and enjoy the prasad with your family." },
    { part: "Congratulations!", title: "Puja Complete!", instruction: "Congratulations on your new home! May it be filled with peace, prosperity, and happiness. It is auspicious to stay in the new house overnight." },
];

        let currentStep = 0;
        const stepContainer = document.getElementById('step-container');
        const progressContainer = document.getElementById('progress-container');
        const stepCounter = document.getElementById('step-counter');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');

        function renderSteps() {
            stepContainer.innerHTML = '';
            progressContainer.innerHTML = '';
            pujaSteps.forEach((step, index) => {
                const stepEl = document.createElement('div');
                stepEl.className = 'step w-full h-full flex flex-col justify-center items-center px-2 py-8 md:py-12';
                stepEl.innerHTML = `
                    <article class="step-content max-w-3xl w-full p-6 md:p-10 text-left">
                        <p class="text-sm md:text-base font-semibold text-amber-600 mb-4 tracking-wide uppercase">${step.part}</p>
                        <h2 class="step-title font-bold text-amber-900 mb-6">${step.title}</h2>
                        <p class="step-text text-amber-800 mb-6">${step.instruction}</p>
                        ${step.mantra ? `<div class="bg-amber-100/90 p-4 md:p-8 rounded-2xl shadow-inner border border-amber-900/10 max-h-[40vh] overflow-y-auto">
                                            <p class="mantra text-amber-900 text-center">${step.mantra}</p>
                                         </div>` : ''}
                    </article>
                `;
                stepContainer.appendChild(stepEl);

                const progressButton = document.createElement('button');
                progressButton.type = 'button';
                progressButton.className = 'progress-item flex-shrink-0 flex items-center gap-2 rounded-full px-3 py-2 bg-amber-50 text-xs md:text-sm text-amber-800 font-semibold border border-amber-900/10 shadow-sm transition-colors hover:bg-amber-200/70 focus:outline-none';
                progressButton.dataset.index = index;
                progressButton.setAttribute('aria-label', `Go to step ${index + 1}: ${step.title}`);
                progressButton.innerHTML = `
                    <span class="inline-flex h-2.5 w-2.5 rounded-full bg-amber-800/40"></span>
                    <span>${index + 1}</span>
                    <span class="hidden md:inline text-amber-900/80">${step.title}</span>
                `;
                progressButton.addEventListener('click', () => goToStep(index));
                progressContainer.appendChild(progressButton);
            });
            updateUI();
        }

        function updateUI() {
            stepContainer.style.transform = `translateX(-${currentStep * 100}%)`;

            const progressItems = document.querySelectorAll('.progress-item');
            progressItems.forEach((item, index) => {
                const indicatorDot = item.querySelector('span:first-child');
                const isActive = index === currentStep;
                item.setAttribute('aria-current', isActive);
                item.classList.toggle('bg-amber-200', isActive);
                item.classList.toggle('text-amber-900', isActive);
                indicatorDot.classList.toggle('bg-amber-800', isActive);
                indicatorDot.classList.toggle('bg-amber-800/40', !isActive);
            });
            
            stepCounter.textContent = `Step ${currentStep + 1} of ${pujaSteps.length}`;

            prevBtn.classList.toggle('opacity-0', currentStep === 0);
            prevBtn.classList.toggle('invisible', currentStep === 0);

            nextBtn.classList.toggle('opacity-0', currentStep === pujaSteps.length - 1);
            nextBtn.classList.toggle('invisible', currentStep === pujaSteps.length - 1);
        }
        
        function goToStep(stepIndex) {
            if (stepIndex >= 0 && stepIndex < pujaSteps.length) {
                currentStep = stepIndex;
                updateUI();
                const activeProgress = document.querySelector('.progress-item[aria-current="true"]');
                if (activeProgress) {
                    activeProgress.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        nextBtn.addEventListener('click', () => goToStep(currentStep + 1));
        prevBtn.addEventListener('click', () => goToStep(currentStep - 1));

        let touchstartX = 0;
        let touchendX = 0;
        const swipeThreshold = 50;
        const carousel = document.getElementById('steps-carousel');

        carousel.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, { passive: true });
        carousel.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            if (touchendX < touchstartX - swipeThreshold) { goToStep(currentStep + 1); }
            if (touchendX > touchstartX + swipeThreshold) { goToStep(currentStep - 1); }
        }, { passive: true });

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') {
                goToStep(currentStep + 1);
            }
            if (e.key === 'ArrowLeft') {
                goToStep(currentStep - 1);
            }
        });

        renderSteps();
    </script>
</body>
</html>
